<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bite XP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{
  --page:#2a2347;
  --ink:#1b1633; --ink2:#4a3d86; --paper:#f4e8c8; --paper2:#e6d6a8;
  --btn:#e8601c; --red:#d9443a; --wood:#c47a45; --woodd:#8b4a2b; --text:#2b2220;
  --ol:0 -6px 0 0 var(--ink),0 6px 0 0 var(--ink),-6px 0 0 0 var(--ink),6px 0 0 0 var(--ink);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--page:#14102a}
}
:root[data-theme="dark"]{--page:#14102a}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;background:var(--page);overflow:hidden;color:var(--text);
  font-family:'DotGothic16','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;font-synthesis:none}
#wrap{position:relative;width:100%;height:100%;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:var(--ink);overflow:hidden;font-size:48px;line-height:1.2}
.spx{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
img.spx{image-rendering:pixelated}

.screen{position:absolute;inset:0;display:none;overflow:hidden}
.screen.on{display:block}
.frame::after{content:"";position:absolute;inset:0;border:18px solid var(--ink);box-shadow:inset 0 0 0 6px var(--ink2);pointer-events:none;z-index:60}

/* backgrounds */
.floorbg{background:repeating-conic-gradient(#aeb8b0 0 25%,#8a9ea3 0 50%) 0 0/192px 192px}
.wallbg{background:
  linear-gradient(#1b1633 0 0) 0 var(--wh,560px)/100% 12px no-repeat,
  repeating-linear-gradient(90deg,#5a3a2a 0 36px,#46291d 36px 42px) 0 calc(var(--wh,560px) + 12px)/100% 128px no-repeat,
  repeating-linear-gradient(90deg,#8a8a46 0 36px,#7a7a3c 36px 72px) 0 0/100% var(--wh,560px) no-repeat,
  repeating-conic-gradient(#aeb8b0 0 25%,#8a9ea3 0 50%) 0 calc(var(--wh,560px) + 140px)/192px 192px}

/* pixel boxes */
.pb{background:var(--bg,var(--paper));box-shadow:var(--ol),inset 6px 6px 0 0 rgba(255,255,255,.35),inset -6px -6px 0 0 rgba(0,0,0,.18)}
.btn{position:absolute;background:var(--btn);color:#fff3dc;border:none;font:inherit;font-size:48px;cursor:pointer;padding:0;
  text-shadow:3px 3px 0 var(--ink);
  box-shadow:var(--ol),0 12px 0 0 var(--ink),inset 6px 6px 0 0 rgba(255,255,255,.4),inset -6px -6px 0 0 rgba(0,0,0,.3)}
.btn:active{transform:translateY(6px);box-shadow:var(--ol),inset 6px 6px 0 0 rgba(255,255,255,.25),inset -6px -6px 0 0 rgba(0,0,0,.3)}
.btn.dim{opacity:.4;filter:grayscale(.7);pointer-events:none}
.ib{width:102px;height:102px;display:flex;align-items:center;justify-content:center;z-index:20}
.abs{position:absolute}

/* ---------- 1 start ---------- */
#s1{--wh:600px}
#titleImg{position:absolute;left:96px;top:72px}
#s1d{position:absolute;left:96px;top:700px}
#s1b{position:absolute;left:372px;top:690px;animation:wob 1.6s steps(2) infinite}
#playBtn{left:750px;top:640px;width:498px;height:186px;display:flex;align-items:center;justify-content:center;animation:blink 1.2s steps(2) infinite}
#s1c{position:absolute;left:1380px;top:430px;animation:bobp 1s steps(2) infinite}
#bubble{position:absolute;left:1070px;top:420px;width:252px;height:162px;display:flex;align-items:center;justify-content:center;font-size:96px;--bg:#fff8ee}
#bubble i{position:absolute;right:-30px;top:120px;width:30px;height:30px;background:#fff8ee;box-shadow:6px 0 0 0 var(--ink),0 6px 0 0 var(--ink),0 -6px 0 0 var(--ink)}
#bubble i+i{right:-66px;top:150px;width:18px;height:18px}
@keyframes wob{50%{transform:translateY(-6px)}}
@keyframes blink{50%{filter:brightness(1.12)}}
@keyframes bobp{50%{transform:translateY(6px)}}

/* ---------- 2 map ---------- */
#world{position:absolute;left:0;top:0;width:3200px;height:1300px;will-change:transform;
  background:repeating-conic-gradient(#aeb8b0 0 25%,#8a9ea3 0 50%) 0 0/192px 192px}
.wtop{position:absolute;background:
  linear-gradient(#1b1633 0 0) 0 120px/100% 12px no-repeat,
  repeating-linear-gradient(90deg,#5a3a2a 0 36px,#46291d 36px 42px) 0 84px/100% 36px no-repeat,
  repeating-linear-gradient(90deg,#8a8a46 0 36px,#7a7a3c 36px 72px) 0 0/100% 84px no-repeat}
.wside{position:absolute;background:repeating-linear-gradient(0deg,#4a3d86 0 12px,#1b1633 12px 24px)}
.door{position:absolute;background:var(--wood);display:flex;align-items:center;justify-content:center;font-size:48px;color:#fff3dc;text-shadow:3px 3px 0 var(--ink);box-shadow:inset 6px 6px 0 0 #d9965a,inset -6px -6px 0 0 var(--woodd),var(--ol)}
.shopimg{position:absolute}
.shopname{position:absolute;text-align:center;font-size:48px;line-height:60px;height:60px;color:#fff3dc;text-shadow:3px 3px 0 var(--ink);white-space:nowrap}
.seat{position:absolute;background:repeating-conic-gradient(#c0602d 0 25%,#d4743c 0 50%) 0 0/48px 48px;box-shadow:var(--ol)}
.seat .lbl{position:absolute;left:18px;top:-30px;height:48px;padding:0 14px;background:var(--paper);box-shadow:var(--ol);font-size:32px;line-height:48px}
.table{position:absolute;width:120px;height:72px;background:var(--wood);
  box-shadow:var(--ol),inset 0 6px 0 0 #e0a368,inset 0 -24px 0 0 var(--woodd)}
.table::before,.table::after{content:"";position:absolute;top:18px;width:36px;height:36px;background:var(--red);box-shadow:var(--ol),inset 6px 6px 0 0 rgba(255,255,255,.35)}
.table::before{left:-48px}.table::after{right:-48px}
.finger{position:absolute;display:none;z-index:30;cursor:pointer;animation:poke .5s steps(2) infinite}
.finger.on{display:block}
@keyframes poke{50%{transform:translateY(-18px)}}
#me{position:absolute;width:120px;height:204px;z-index:20;pointer-events:none}
#me .sh{position:absolute;left:12px;bottom:6px;width:96px;height:18px;background:rgba(27,22,51,.4);box-shadow:6px 0 0 0 rgba(27,22,51,.4),-6px 0 0 0 rgba(27,22,51,.4)}
#me img{position:absolute;left:0;top:0}

#joy{position:absolute;left:78px;bottom:78px;width:264px;height:264px;background:rgba(27,22,51,.62);touch-action:none;z-index:30;
  box-shadow:var(--ol),inset 6px 6px 0 0 rgba(255,255,255,.4),inset -6px -6px 0 0 rgba(0,0,0,.2)}
#knob{position:absolute;left:50%;top:50%;width:114px;height:114px;margin:-57px 0 0 -57px;background:var(--btn);
  box-shadow:var(--ol),inset 6px 6px 0 0 rgba(255,255,255,.4),inset -6px -6px 0 0 rgba(0,0,0,.3)}
#hud{position:absolute;right:72px;top:60px;width:258px;z-index:30;display:flex;flex-direction:column;gap:30px}
#hud .btn{position:relative;width:100%;height:96px;font-size:40px}
#xpBadge{display:inline-block;min-width:60px;margin-left:10px;padding:0 10px;background:#fff3dc;color:var(--red);text-shadow:none;box-shadow:var(--ol)}
#orderBox{display:none;padding:18px 8px;text-align:center;cursor:pointer;line-height:1.25;font-size:36px;--bg:#fff8ee}
#orderBox .no{font-size:64px;color:var(--red)}
#orderBox small{font-size:28px;color:#6a5a50;display:block}
#hint{position:absolute;left:50%;bottom:54px;transform:translateX(-50%);padding:12px 30px;font-size:32px;z-index:30;transition:opacity .6s;white-space:nowrap}

/* ---------- 3 shop ---------- */
#scene{position:absolute;inset:0;z-index:0}
#scene>*{position:absolute}
#shopFront{position:absolute;left:0;top:0;width:1280px;height:1080px;z-index:1}
#shopFront>*{position:absolute}
#crowdPanel{position:absolute;left:1290px;top:66px;width:540px;height:940px;padding:26px 18px;text-align:center;z-index:2}
#crowdPanel h2{font-size:72px;font-weight:400;letter-spacing:.1em}
#crowdFace{margin:16px auto 0;width:288px}
#crowdCap{font-size:36px;color:#7a5a46;margin:14px 0 36px}
#queueBox{padding:30px 6px;font-size:48px;line-height:1.7;margin:0 10px;--bg:#fff8ee}
#queueBox b{color:var(--red);font-size:80px;font-weight:400;margin:0 8px}
#orderOnline{left:430px;top:730px;width:480px;height:132px;font-size:60px}

/* ---------- 4 menu ---------- */
#book{position:absolute;left:204px;top:156px;width:1130px;height:840px;display:grid;grid-template-columns:1fr 1fr;padding:108px 24px 66px}
#book::before{content:"";position:absolute;left:50%;top:96px;bottom:60px;width:12px;margin-left:-6px;background:var(--ink)}
#bookTitle{position:absolute;left:0;right:0;top:20px;text-align:center;font-size:60px;letter-spacing:.12em}
#bookPage{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:32px;color:#7a5a46}
.pg{display:flex;flex-direction:column;justify-content:space-around;padding:0 18px}
.cell{position:relative;display:flex;align-items:center;gap:26px;cursor:pointer;padding:10px}
.cell:active{transform:translate(4px,4px)}
.cell .pic{flex:none;width:204px;height:204px;display:flex;align-items:center;justify-content:center;box-shadow:var(--ol),inset 6px 6px 0 0 rgba(255,255,255,.4),inset -6px -6px 0 0 rgba(0,0,0,.15)}
.cell .tx{display:flex;flex-direction:column;gap:12px;font-size:48px;line-height:1.15}
.cell .tx span{color:var(--red);font-size:48px}
.cell .q{position:absolute;right:0;top:-6px;min-width:60px;height:60px;background:var(--red);color:#fff;font-size:36px;line-height:60px;text-align:center;padding:0 10px;box-shadow:var(--ol);display:none}
.cell .q.on{display:block}
.arrow{position:absolute;top:500px;width:108px;height:150px;padding:0;border:none;background:none;cursor:pointer;z-index:10;display:flex;align-items:center;justify-content:center}
.arrow.dim{opacity:.3;pointer-events:none}
#bag{position:absolute;left:1440px;top:108px;width:420px;height:900px}
#bag .hd{position:absolute;top:0;width:96px;height:100px;border:12px solid var(--ink);border-bottom:none}
#bagBody{position:absolute;left:0;top:78px;width:420px;height:822px;padding:78px 22px 24px;display:flex;flex-direction:column;--bg:#d9965a}
#bagBody::before{content:"";position:absolute;left:0;right:0;top:0;height:48px;background:#b9773e;box-shadow:inset 0 -6px 0 0 var(--ink)}
#bagTitle{position:absolute;left:0;right:0;top:58px;text-align:center;font-size:32px;color:#5a2f1b}
#bagList{flex:1;overflow-y:auto;margin-top:36px;display:flex;flex-direction:column;gap:14px;scrollbar-width:none}
#bagList::-webkit-scrollbar{display:none}
#bagList .empty{margin:auto;text-align:center;font-size:36px;color:#5a2f1b;line-height:1.5}
.bl{display:flex;align-items:center;gap:8px;background:#fff8ee;box-shadow:var(--ol);margin:6px;padding:6px 8px;font-size:32px}
.bl .n{flex:1;white-space:nowrap}
.bl .mn{width:44px;height:44px;background:var(--btn);color:#fff;border:none;font:inherit;font-size:32px;line-height:1;cursor:pointer;padding:0;box-shadow:var(--ol)}
#bagFoot{display:flex;align-items:flex-end;justify-content:space-between;padding-top:14px;gap:10px}
#bagTotal{font-size:40px;line-height:1.2}
#bagTotal b{color:var(--red);font-size:56px;font-weight:400}
#sendBtn{position:relative;width:174px;height:108px;font-size:48px}

/* ---------- 5 ticket ---------- */
#ticket{position:absolute;left:300px;top:78px;width:540px;height:936px;background-size:100% 100%;image-rendering:pixelated}
#ticketTx{position:absolute;inset:96px 20px 96px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
#ticketTx .lb{font-size:44px;color:#7a5a46;letter-spacing:.2em}
#ticketTx .no{font-size:176px;line-height:1.05;color:var(--red)}
#ticketTx .sub{font-size:40px;line-height:1.5}
#ticketTx .dash{width:420px;height:6px;margin:22px 0;background:repeating-linear-gradient(90deg,var(--ink) 0 18px,transparent 18px 36px)}
#nowBox{position:absolute;left:960px;top:360px;width:840px;height:174px;display:flex;align-items:center;justify-content:center;font-size:80px;--bg:#fff8ee}
#nowBox b{color:var(--red);margin:0 14px;font-weight:400}
#nowSub{position:absolute;left:960px;top:582px;width:840px;text-align:center;font-size:48px;line-height:1.6;color:#fff3dc;text-shadow:3px 3px 0 var(--ink)}

/* ---------- 6 check-in ---------- */
#camBox{position:absolute;left:72px;top:72px;width:1470px;height:936px;overflow:hidden;--bg:#2b2147}
#vid,#shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
#shot{image-rendering:auto}
#camMsg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#d8d0f0;font-size:48px;line-height:1.6;text-align:center;padding:0 170px;gap:24px}
#shutter{position:absolute;right:48px;top:50%;margin-top:-84px;width:168px;height:168px;background:none;border:none;padding:0;cursor:pointer}
#shutter:active{transform:translateY(6px)}
#shutter.dim{opacity:.3;pointer-events:none}
#upBtn{left:1626px;top:390px;width:234px;height:222px;font-size:72px}
#ckCount{position:absolute;left:1626px;top:690px;width:234px;height:108px;display:flex;align-items:center;justify-content:center;font-size:64px;--bg:#fff8ee}
#ckNote{position:absolute;left:1596px;top:830px;width:294px;text-align:center;font-size:32px;line-height:1.5;color:#fff3dc;text-shadow:3px 3px 0 var(--ink);white-space:pre-line}

/* ---------- 7 xp map ---------- */
#vTicket{position:absolute;left:66px;top:210px;display:flex;align-items:center;gap:22px}
#vTicketBox{position:relative}
#vTicketBox span{position:absolute;left:96px;top:30px;width:108px;text-align:center;font-size:44px;color:var(--red)}
#vCount{font-size:96px;color:#fff3dc;text-shadow:6px 6px 0 var(--ink)}
#useBtn{left:66px;top:480px;width:330px;height:132px;font-size:64px}
#xpMap{position:absolute;left:486px;top:66px;width:1380px;height:960px;overflow-y:auto;overflow-x:hidden;scrollbar-color:var(--btn) #d8c9a0;--bg:#f6e3dc;
  background-image:repeating-conic-gradient(#f9e6df 0 25%,#fff8f2 0 50%);background-size:192px 192px}
#xpMap::-webkit-scrollbar{width:42px}
#xpMap::-webkit-scrollbar-track{background:#d8c9a0;box-shadow:inset 6px 0 0 0 var(--ink)}
#xpMap::-webkit-scrollbar-thumb{background:var(--btn);box-shadow:inset 0 0 0 6px var(--ink)}
#xpInner{position:relative;width:100%}
#xpInner>*{position:absolute}
.dot{width:12px;height:12px;margin:-6px 0 0 -6px}
.nd{width:102px;height:102px;margin:-51px 0 0 -51px;display:flex;align-items:center;justify-content:center;font-size:40px;color:#6a6a7a}
.nd img{position:absolute;left:0;top:0}
.nd span{position:relative}
.nd.on{color:var(--ink)}
.nd.cur{animation:bobp 1s steps(2) infinite}
.nd.start{font-size:32px;color:var(--ink)}
.ch{width:156px;margin:-80px 0 0 -78px;text-align:center}
.ch .tg{position:absolute;left:50%;top:-52px;transform:translateX(-50%);background:var(--red);color:#fff;padding:0 14px;font-size:32px;line-height:48px;white-space:nowrap;box-shadow:var(--ol)}
.ch.got .tg{background:#3c9a4a}
.me{width:100px;margin:-134px 0 0 62px;animation:bobp .8s steps(2) infinite;z-index:5}

/* ---------- 8 qr ---------- */
#qrCard{position:absolute;left:560px;top:96px;width:800px;height:888px;background:#fff;display:flex;flex-direction:column;align-items:center;padding:34px 0 0}
#qr{width:640px;height:640px;image-rendering:pixelated}
#qrTitle{font-size:64px;margin-top:22px;color:var(--red)}
#qrNote{font-size:36px;color:#7a5a46;margin-top:4px}
#eater{position:absolute;right:66px;bottom:36px}

#toast{position:absolute;left:50%;top:126px;transform:translate(-50%,-30px);background:var(--ink);color:#fff3dc;padding:20px 48px;font-size:40px;opacity:0;pointer-events:none;z-index:100;transition:opacity .25s,transform .25s;white-space:nowrap;box-shadow:0 0 0 6px #fff3dc}
#toast.on{opacity:1;transform:translate(-50%,0)}

#demoBtn{position:fixed;right:8px;top:calc(8px + env(safe-area-inset-top,0px));width:34px;height:34px;border:none;background:rgba(232,96,28,.7);color:#fff;font-size:18px;cursor:pointer;z-index:200}
#demoPanel{position:fixed;right:8px;top:calc(50px + env(safe-area-inset-top,0px));background:#fff8ee;color:#2b2220;border:3px solid #1b1633;padding:12px;display:none;flex-direction:column;gap:8px;z-index:200;font-size:15px}
#demoPanel.on{display:flex}
#demoPanel button{font:inherit;padding:8px 12px;border:2px solid #1b1633;background:#f4c542;cursor:pointer}
#rot{position:fixed;inset:0;background:var(--page);color:#fff3dc;display:none;align-items:center;justify-content:center;text-align:center;font-size:24px;line-height:1.7;z-index:300;padding:30px}
@media (orientation:portrait){#rot{display:flex}}
@media (prefers-reduced-motion: reduce){#s1b,#playBtn,#s1c,.finger,.nd.cur,.me{animation:none}}
</style>
</head>
<body>
<div id="wrap"><div id="stage">

  <!-- 1 START -->
  <section class="screen frame wallbg on" id="s1">
    <div id="titleImg"></div>
    <div id="s1d"></div><div id="s1b"></div>
    <button class="btn" id="playBtn" aria-label="PLAY"></button>
    <div id="bubble" class="pb">餓<i></i><i></i></div>
    <div id="s1c"></div>
  </section>

  <!-- 2 MAP -->
  <section class="screen frame" id="s2">
    <div id="world"></div>
    <div id="joy"><div id="knob"></div></div>
    <div id="hud">
      <button class="btn" id="xpBtn">經驗值<span id="xpBadge">0</span></button>
      <button class="btn" id="ckBtn">打卡</button>
      <div id="orderBox" class="pb"></div>
    </div>
    <div id="hint" class="pb">拖曳左下搖桿（或方向鍵／WASD）移動，走近店家點手指進入</div>
  </section>

  <!-- 3 SHOP -->
  <section class="screen frame wallbg" id="s3" style="--wh:560px">
    <div id="scene"></div>
    <div id="shopFront"></div>
    <button class="btn ib" data-go="s2" style="left:66px;top:60px" aria-label="回主畫面"><span data-ic="home" data-s="6"></span></button>
    <div id="crowdPanel" class="pb">
      <h2>目前人潮</h2>
      <div id="crowdFace"></div>
      <div id="crowdCap"></div>
      <div id="queueBox" class="pb"></div>
    </div>
  </section>

  <!-- 4 MENU -->
  <section class="screen frame floorbg" id="s4">
    <button class="btn ib" data-go="s3" style="left:66px;top:60px" aria-label="回店家"><span data-ic="back" data-s="6"></span></button>
    <div id="book" class="pb"><div id="bookTitle"></div><div id="pgL" class="pg"></div><div id="pgR" class="pg"></div><div id="bookPage"></div></div>
    <button class="arrow" id="arL" style="left:84px" aria-label="上一頁"><span data-ic="back" data-s="9" data-c="#e8601c"></span></button>
    <button class="arrow" id="arR" style="left:1296px" aria-label="下一頁"><span data-ic="back" data-s="9" data-c="#e8601c" data-flip="1"></span></button>
    <div id="bag">
      <div class="hd" style="left:78px"></div><div class="hd" style="left:246px"></div>
      <div id="bagBody" class="pb">
        <div id="bagTitle">購物袋</div>
        <div id="bagList"></div>
        <div id="bagFoot"><div id="bagTotal">共<br><b>0</b> 元</div><button class="btn dim" id="sendBtn">送出</button></div>
      </div>
    </div>
  </section>

  <!-- 5 TICKET -->
  <section class="screen frame floorbg" id="s5">
    <button class="btn ib" data-go="s2" style="left:66px;top:60px" aria-label="回主畫面"><span data-ic="home" data-s="6"></span></button>
    <div id="ticket"><div id="ticketTx"></div></div>
    <div id="nowBox" class="pb"></div>
    <div id="nowSub"></div>
  </section>

  <!-- 6 CHECK-IN -->
  <section class="screen frame floorbg" id="s6">
    <div id="camBox" class="pb">
      <video id="vid" autoplay playsinline muted></video>
      <img id="shot" alt="">
      <div id="camMsg"><div id="camIc"></div><div id="camTxt">正在開啟相機…</div></div>
      <button id="shutter" aria-label="拍照"></button>
    </div>
    <button class="btn ib" data-go="s2" style="right:72px;top:60px" aria-label="回主畫面"><span data-ic="home" data-s="6"></span></button>
    <button class="btn" id="upBtn">上傳</button>
    <div id="ckCount" class="pb">0/2</div>
    <div id="ckNote"></div>
    <input type="file" id="file" accept="image/*" capture="environment" hidden>

function bitText(str,bit,fill,hi,sh){

/* ---- player / joystick ---- */
const Pl={x:940,y:1190,dir:'down',flip:1,t:0,last:''};
const keys=new Set();
let jv={x:0,y:0},jid=null;
const joy=$('#joy'),knob=$('#knob');
function joyMove(e){
  const r=joy.getBoundingClientRect();
  const cx=r.left+r.width/2,cy=r.top+r.height/2;
  let dx=e.clientX-cx,dy=e.clientY-cy;
  const max=r.width/2*0.5,d=Math.hypot(dx,dy),k=d>max?max/d:1;
  dx*=k;dy*=k;jv.x=dx/max;jv.y=dy/max;
  knob.style.transform='translate('+(Math.round(dx/SCALE/6)*6)+'px,'+(Math.round(dy/SCALE/6)*6)+'px)';
}
joy.addEventListener('pointerdown',e=>{jid=e.pointerId;joy.setPointerCapture(jid);joyMove(e);hideHint()});
joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)joyMove(e)});
const endJ=e=>{if(e.pointerId===jid){jid=null;jv={x:0,y:0};knob.style.transform='translate(0,0)'}};
joy.addEventListener('pointerup',endJ);joy.addEventListener('pointercancel',endJ);
window.addEventListener('keydown',e=>{
  const k=e.key.length===1?e.key.toLowerCase():e.key;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d'].includes(k)){keys.add(k);hideHint();if(cur==='s2')e.preventDefault()}
  if((e.key==='Enter'||e.key===' ')&&cur==='s2'&&nearShop){e.preventDefault();openShop(nearShop)}
});
window.addEventListener('keyup',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;keys.delete(k)});
let hintHidden=false;
function hideHint(){if(hintHidden)return;hintHidden=true;$('#hint').style.opacity=0}
function hit(x,y){
  const l=x-22,r=x+22,t=y-24,b=y;
  for(const o of OBST){if(r>o.x&&l<o.x+o.w&&b>o.y&&t<o.y+o.h)return true}
  return false;
}
function moveBy(dx,dy){
  let nx=Pl.x+dx;
  const minX=(Pl.y>570&&Pl.y<650)?24:72;
  nx=Math.max(minX,Math.min(WW-72,nx));
  if(!hit(nx,Pl.y))Pl.x=nx;
  let ny=Pl.y+dy;
  const maxY=(Pl.x>875&&Pl.x<1005)?1290:1226;
  ny=Math.max(156,Math.min(maxY,ny));
  if(!hit(Pl.x,ny))Pl.y=ny;
}
const SEQ=['i','a','i','b'];
function step(dt){
  let vx=jv.x,vy=jv.y;
  if(keys.has('ArrowLeft')||keys.has('a'))vx-=1;
  if(keys.has('ArrowRight')||keys.has('d'))vx+=1;
  if(keys.has('ArrowUp')||keys.has('w'))vy-=1;
  if(keys.has('ArrowDown')||keys.has('s'))vy+=1;
  const len=Math.hypot(vx,vy);
  if(len>1){vx/=len;vy/=len}
  const moving=len>0.08;
  if(moving){
    moveBy(vx*540*dt,vy*540*dt);Pl.t+=dt;
    if(Math.abs(vx)>Math.abs(vy)){Pl.dir='side';Pl.flip=vx<0?-1:1}else Pl.dir=vy<0?'up':'down';
  }else Pl.t=0;
  const fr=moving?SEQ[Math.floor(Pl.t*8)%4]:'i';
  const src=CHAR[Pl.dir][fr];
  const im=$('#meImg');
  if(Pl.last!==src){im.src=src;Pl.last=src}
  im.style.transform=Pl.flip<0&&Pl.dir==='side'?'scaleX(-1)':'';
  const me=$('#me');
  me.style.left=(Math.round(Pl.x/6)*6-60)+'px';me.style.top=(Math.round(Pl.y/6)*6-192)+'px';
  const cx=Math.max(0,Math.min(WW-1920,Pl.x-960)),cy=Math.max(0,Math.min(WH-1080,Pl.y-540));
  $('#world').style.transform='translate('+(-Math.round(cx/6)*6)+'px,'+(-Math.round(cy/6)*6)+'px)';
  let best=null,bd=1e9;
  SHOPS.forEach(s=>{
    const qx=Math.max(s.x,Math.min(Pl.x,s.x+s.w)),qy=Math.max(s.y,Math.min(Pl.y,s.y+s.h));
    const d=Math.hypot(Pl.x-qx,Pl.y-qy);
    if(d<130&&d<bd){bd=d;best=s}
  });
  if(best!==nearShop){nearShop=best;SHOPS.forEach(s=>$('#f_'+s.id).classList.toggle('on',s===best))}
}
let lastT=performance.now();
function loop(t){
  const dt=Math.min(.05,(t-lastT)/1000);lastT=t;
  if(cur==='s2')step(dt);
  requestAnimationFrame(loop);
}

let cart={},page=0;
const PASTEL=['#ffd9c9','#d9efc8','#cfe7f2','#f5ddf0','#fff0b0','#ffd0d3','#e8dcc8','#ddebff'];
function enter4(){cart={};page=0;renderMenu()}
function renderMenu(){
  const s=curShop,it=s.menu,st=page*4,pages=Math.ceil(it.length/4);
  $('#bookTitle').textContent=s.name+' 菜單';
  $('#bookPage').textContent=(page+1)+' / '+pages;
  const cellH=i=>{
    const m=it[st+i];if(!m)return '<div></div>';
    const idx=st+i,q=cart[idx]||0;
    return '<div class="cell" data-i="'+idx+'"><div class="pic" style="background:'+PASTEL[idx%PASTEL.length]+'">'+IMG(icon(m[0]),10)+'</div>'
      +'<div class="tx">'+m[1]+'<span>$'+m[2]+'</span></div><div class="q'+(q?' on':'')+'">×'+q+'</div></div>';
  };
  $('#pgL').innerHTML=cellH(0)+cellH(1);
  $('#pgR').innerHTML=cellH(2)+cellH(3);
  document.querySelectorAll('.cell').forEach(c=>c.addEventListener('click',()=>{const i=+c.dataset.i;cart[i]=(cart[i]||0)+1;renderMenu()}));
  $('#arL').classList.toggle('dim',page===0);
  $('#arR').classList.toggle('dim',page>=pages-1);
  renderBag();
}
$('#arL').addEventListener('click',()=>{if(page>0){page--;renderMenu()}});
$('#arR').addEventListener('click',()=>{if(page<Math.ceil(curShop.menu.length/4)-1){page++;renderMenu()}});
const cartTotal=()=>Object.keys(cart).reduce((t,i)=>t+curShop.menu[i][2]*cart[i],0);
function renderBag(){
  const ks=Object.keys(cart).filter(i=>cart[i]>0),L=$('#bagList');
  if(!ks.length)L.innerHTML='<div class="empty">點選菜單上的餐點<br>放進購物袋</div>';
  else L.innerHTML=ks.map(i=>{const m=curShop.menu[i];
    return '<div class="bl"><span class="n">'+m[1]+'</span><button class="mn" data-d="-1" data-i="'+i+'">−</button><span>'+cart[i]+'</span><button class="mn" data-d="1" data-i="'+i+'">＋</button></div>'}).join('');
  L.querySelectorAll('.mn').forEach(b=>b.addEventListener('click',()=>{const i=b.dataset.i;cart[i]=Math.max(0,(cart[i]||0)+(+b.dataset.d));renderMenu()}));
  $('#bagTotal').innerHTML='共<br><b>'+cartTotal()+'</b> 元';
  $('#sendBtn').classList.toggle('dim',!ks.length);
}
$('#sendBtn').addEventListener('click',()=>{
  const ks=Object.keys(cart).filter(i=>cart[i]>0);if(!ks.length)return;
  const s=curShop,ahead=aheadOf(s);s.lastNo+=1;
  orders.push({shop:s.name,no:s.lastNo,serving:s.lastNo-ahead,total:cartTotal(),count:ks.reduce((t,i)=>t+cart[i],0)});
  go('s5');
});

/* ---- screen 6 ---- */
let stream=null,photo=null;
const vid=$('#vid'),shot=$('#shot'),camMsg=$('#camMsg'),camTxt=$('#camTxt'),shutter=$('#shutter');
async function startCam(){
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('no cam');
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
    vid.srcObject=stream;vid.style.display='block';camMsg.style.display='none';
  }catch(e){
    stream=null;vid.style.display='none';camMsg.style.display='flex';
    camTxt.innerHTML='無法使用相機<br>點右側圓形按鈕，改從相簿選一張照片';
  }
}
function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}vid.srcObject=null}
function renderCk(){
  $('#ckCount').textContent=G.checkins+'/2';
  const full=G.checkins>=2;
  $('#upBtn').classList.toggle('dim',full||!photo);
  shutter.classList.toggle('dim',full);
  shutter.innerHTML=IMG(discImg(16,photo?'#d9443a':'#fff8ee',INK,'#ffffff'),10);
  $('#ckNote').textContent=full?'今天的打卡次數已用完\n明天再來':(photo?'照片已就緒，按「上傳」':'先拍一張照片');
  if(full&&!photo){camMsg.style.display='flex';vid.style.display='none';camTxt.innerHTML='今天已打卡 2 次<br>明天再來吧'}
}
function enter6(){
  photo=null;shot.style.display='none';
  if(G.checkins<2){camMsg.style.display='flex';camTxt.textContent='正在開啟相機…';startCam()}
  renderCk();
}
function setPhoto(url){photo=url;shot.src=url;shot.style.display='block';vid.style.display='none';camMsg.style.display='none';renderCk()}
function clearPhoto(){
  photo=null;shot.style.display='none';
  if(stream)vid.style.display='block';else{camMsg.style.display='flex';camTxt.innerHTML='點右側圓形按鈕，選一張照片'}
  renderCk();
}
shutter.addEventListener('click',()=>{
  if(G.checkins>=2)return;
  if(photo){clearPhoto();return}
  if(stream&&vid.videoWidth){const c=document.createElement('canvas');c.width=vid.videoWidth;c.height=vid.videoHeight;c.getContext('2d').drawImage(vid,0,0);setPhoto(c.toDataURL('image/jpeg',.8))}
  else $('#file').click();
});
$('#file').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>setPhoto(r.result);r.readAsDataURL(f);e.target.value=''});
$('#upBtn').addEventListener('click',()=>{
  if(!photo||G.checkins>=2)return;
  const before=CHESTS.filter(c=>c<=G.xp).length;
  G.checkins++;G.xp++;save();
  const after=CHESTS.filter(c=>c<=G.xp).length;
  photo=null;shot.style.display='none';
  toast(after>before?'打卡成功！經驗值 +1，解鎖寶箱，獲得 100 元抵用券':'打卡成功！經驗值 +1');
  if(G.checkins<2)clearPhoto();else{stopCam();renderCk()}
});

/* ---- screen 7 ---- */
function enter7(){renderXP()}
function renderXP(){
  const map=$('#xpMap'),inner=$('#xpInner');
  const MW=map.clientWidth||1330,H=N*STEP+520,cx=MW/2,amp=MW*0.26;
  const sn=v=>Math.round(v/6)*6;
  inner.style.height=H+'px';
  const pos=i=>({x:sn(cx+Math.sin(i*0.9)*amp),y:sn(H-190-i*STEP)});
  const pts=[];for(let i=0;i<=N;i++)pts.push(pos(i));
  let h='';
  for(let i=1;i<=N;i++){
    const a=pts[i-1],b=pts[i],my=(a.y+b.y)/2,poly=[];
    for(let k=0;k<=24;k++){const t=k/24,u=1-t;poly.push([u*u*u*a.x+3*u*u*t*a.x+3*u*t*t*b.x+t*t*t*b.x,u*u*u*a.y+3*u*u*t*my+3*u*t*t*my+t*t*t*b.y])}
    let acc=0;const col=i<=G.xp?'#d9443a':'#b9a98a';
    for(let k=1;k<poly.length;k++){
      acc+=Math.hypot(poly[k][0]-poly[k-1][0],poly[k][1]-poly[k-1][1]);
      if(acc>=36){acc=0;h+='<div class="dot" style="left:'+sn(poly[k][0])+'px;top:'+sn(poly[k][1])+'px;background:'+col+';box-shadow:0 0 0 0 #000,inset -3px -3px 0 rgba(0,0,0,.25)"></div>'}
    }
  }
  const nodeLock=IMG(discImg(16,'#d8cfc0',INK,'#ffffff'),6),nodeOn=IMG(discImg(16,'#f4c542',INK,'#fff8c0'),6),nodeSt=IMG(discImg(16,'#7fd070',INK,'#d8ffd0'),6);
  h+='<div class="nd start" style="left:'+pts[0].x+'px;top:'+pts[0].y+'px">'+nodeSt+'<span>出發</span></div>';
  for(let i=1;i<=N;i++){
    const p=pts[i];
    if(CHESTS.includes(i)){
      const got=i<=G.xp;
      h+='<div class="ch'+(got?' got':'')+'" style="left:'+p.x+'px;top:'+p.y+'px"><div class="tg">'+(got?'已獲得 100 元':'100 元券')+'</div>'+IMG(grid(got?CHEST_O:CHEST_C),9)+'</div>';
    }else{
      h+='<div class="nd'+(i<=G.xp?' on':'')+(i===G.xp?' cur':'')+'" style="left:'+p.x+'px;top:'+p.y+'px">'+(i<=G.xp?nodeOn:nodeLock)+'<span>'+(i<=G.xp?IMG(grid(STAR,{y:'#e8601c'}),6):i)+'</span></div>';
    }
  }
  const mp=pts[Math.min(G.xp,N)];
  h+='<div class="me" style="left:'+mp.x+'px;top:'+mp.y+'px">'+IMG(bust({}),5)+'</div>';
  inner.innerHTML=h;
  map.scrollTop=Math.max(0,mp.y-map.clientHeight/2);
  $('#vCount').textContent=': '+String(vouchers()).padStart(2,'0');
  $('#useBtn').classList.toggle('dim',vouchers()===0);
}
(function(){
  const m=$('#xpMap');let drag=null;
  m.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.target===m)return;drag={y:e.clientY,t:m.scrollTop};m.setPointerCapture(e.pointerId)});
  m.addEventListener('pointermove',e=>{if(drag)m.scrollTop=drag.t-(e.clientY-drag.y)/SCALE});
  const end=()=>{drag=null};m.addEventListener('pointerup',end);m.addEventListener('pointercancel',end);
})();
$('#useBtn').addEventListener('click',()=>{
  if(vouchers()===0){toast('目前沒有可用的抵用券');return}
  G.used++;save();go('s8');
});

/* ================= tickers ================= */
setInterval(()=>{
  orders.forEach(o=>{if(o.serving<o.no)o.serving++});
  SHOPS.forEach(s=>{s.crowd=Math.max(0,Math.min(1,s.crowd+(Math.random()-.5)*.3))});
  if(cur==='s5')renderTicket();
  if(cur==='s3')renderCrowd();
  if(cur==='s2')renderOrderBox();
},4000);

/* ================= demo tools ================= */
$('#demoBtn').addEventListener('click',()=>$('#demoPanel').classList.toggle('on'));
$('#dmDay').addEventListener('click',()=>{G.checkins=0;save();toast('已換日，打卡次數歸零');if(cur==='s6')enter6()});
$('#dmXp').addEventListener('click',()=>{G.xp=Math.min(N,G.xp+1);save();toast('經驗值 +1（示範）');if(cur==='s7')renderXP();if(cur==='s2')enter2()});
$('#dmReset').addEventListener('click',()=>{G={xp:0,used:0,checkins:0,day:today()};orders=[];save();toast('已重設全部進度');if(cur==='s7')renderXP();if(cur==='s2')enter2();if(cur==='s6')enter6()});

/* ================= init ================= */
function initArt(){
  $('#titleImg').innerHTML=IMG(bitText('BITE XP',6,'#d9443a','#ff8a70','#8a1f1a'),6);
  $('#s1d').innerHTML=IMG(icon(cup('#d9443a')),14);
  $('#s1b').innerHTML=IMG(icon(BURG),14);
  $('#playBtn').innerHTML=IMG(bitText('PLAY',3,'#fff3dc','#ffffff','#8a3510'),6);
  const hc=mk(20,34,x=>drawChar(x,'down','i',{open:true}));
  $('#s1c').innerHTML=IMG(hc,18);
  $('#vTicketBox').innerHTML=IMG(voucherSprite(),8)+'<span>100</span>';
  $('#camIc').innerHTML=IMG(uiIcon('cam','#d8d0f0'),12);
  $('#eater').innerHTML=IMG(charCanvas('down','i',{eat:true}),14);
  document.querySelectorAll('[data-ic]').forEach(el=>{
    el.innerHTML=IMG(uiIcon(el.dataset.ic,el.dataset.c||null),+el.dataset.s||6,el.dataset.flip?'transform:scaleX(-1)':'');
  });
}
initArt();buildWorld();
window.BX={go,Pl,openShop:id=>openShop(SHOPS.find(s=>s.id===id)),G,save,renderXP};
requestAnimationFrame(loop);
setTimeout(hideHint,12000);
})();
</script>
</body>
